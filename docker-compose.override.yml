services:
  demo-model-check:
    image: busybox:1.37.0-uclibc@sha256:39e0df8c4d65953b55c344f017e1ff2e0031a7454b3c24e6b76d402f207e315a
    entrypoint: [ /bin/sh, /infra/demo/check-model.sh ]
    environment:
      MODEL_MODE: ${MODEL_MODE:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./infra/demo/check-model.sh:/infra/demo/check-model.sh:ro
    network_mode: none
    read_only: true
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  demo-run-start:
    image: postgres:16.9-alpine3.21@sha256:36e8aabaa6fa6037537cff64011fa45a200fe2ba202141b9aca48cff3df7ad42
    entrypoint: [ /bin/sh, /infra/demo/mark-start.sh ]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pypi:pypi_local_only@postgres:5432/pypi_intelligence}
    volumes:
      - ./infra/demo/mark-start.sh:/infra/demo/mark-start.sh:ro
      - demo-state:/demo-state
      - ./infra/db/read-only-pgdata:/var/lib/postgresql/data:ro
    networks: [ pipeline ]
    read_only: true
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db-init:
        condition: service_completed_successfully
      demo-model-check:
        condition: service_completed_successfully
    restart: "no"

  connect-fixture:
    extends:
      file: docker-compose.yml
      service: connect-source
    command: [ run, -r, /config/source-resources.yaml, /config/source-demo-fixture.yaml ]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      demo-run-start:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully

  reasoning-fixture:
    extends:
      file: docker-compose.yml
      service: reasoning-worker
    environment:
      EVIDENCE_MODE: fixture
      MODEL_MODE: fake
      OPENAI_API_KEY: ""
      EXIT_AFTER_IDLE_POLLS: 2
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      alloy:
        condition: service_healthy
      connect-fixture:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully

  demo-persistence-gate:
    image: postgres:16.9-alpine3.21@sha256:36e8aabaa6fa6037537cff64011fa45a200fe2ba202141b9aca48cff3df7ad42
    entrypoint: [ /bin/sh, /infra/demo/check-persistence.sh ]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pypi:pypi_local_only@postgres:5432/pypi_intelligence}
      DEMO_GATE_TIMEOUT_SECONDS: ${DEMO_GATE_TIMEOUT_SECONDS:-180}
    volumes:
      - ./infra/demo/check-persistence.sh:/infra/demo/check-persistence.sh:ro
      - demo-state:/demo-state:ro
      - ./infra/db/read-only-pgdata:/var/lib/postgresql/data:ro
    networks: [ pipeline ]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    depends_on:
      connect-sink:
        condition: service_healthy
      reasoning-fixture:
        condition: service_completed_successfully
    restart: "no"

  drain-gate:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.13@sha256:ae0a858eddd0538dacbba5696f9be1f590de1fe51283964afc85f5510fa8f32e
    entrypoint: [ /bin/sh, /infra/demo/check-lag.sh ]
    environment:
      DEMO_GATE_MAX_POLLS: ${DEMO_GATE_MAX_POLLS:-90}
      DEMO_GATE_POLL_INTERVAL_SECONDS: ${DEMO_GATE_POLL_INTERVAL_SECONDS:-2}
    volumes:
      - ./infra/demo/check-lag.sh:/infra/demo/check-lag.sh:ro
    networks: [ pipeline ]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    depends_on:
      demo-persistence-gate:
        condition: service_completed_successfully
    restart: "no"

  reasoning-worker:
    environment:
      EVIDENCE_MODE: pypi
      MODEL_MODE: ${MODEL_MODE:-auto}
      EXIT_AFTER_IDLE_POLLS: 0
    depends_on:
      drain-gate:
        condition: service_completed_successfully

  connect-source:
    command: [ run, -r, /config/source-resources.yaml, /config/source-live.yaml ]
    depends_on:
      drain-gate:
        condition: service_completed_successfully
      reasoning-worker:
        condition: service_healthy

  api:
    environment:
      SOURCE_CONFIG: source-live.yaml

volumes:
  demo-state:
