[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pypi-change-reasoning-worker"
version = "0.1.0"
description = "Deterministic and model-assisted reasoning worker for PyPI change intelligence"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.49.0,<3",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "packaging>=24.2,<27",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.8,<3"]
runtime = [
  "confluent-kafka>=2.8,<3",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
test = [
  "jsonschema[format-nongpl]>=4.23,<5",
  "license-expression==30.4.4",
  "pytest>=8.3,<10",
]

[project.scripts]
pypi-reasoning-worker = "reasoning_worker.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_worker"]

[tool.pytest.ini_options]
testpaths = ["../../tests/reasoning"]
addopts = "-q"
