target-version = "py312"
line-length = 100
extend-exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".uv-cache",
  ".venv",
  "data",
  "dist",
  "htmlcov",
  "node_modules",
  "services/api/.venv",
  "services/reasoning/.venv",
  "web",
]

[format]
docstring-code-format = true
line-ending = "lf"

[lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "F",
  "G",
  "I",
  "LOG",
  "N",
  "PIE",
  "PLE",
  "PLW",
  "PT",
  "RSE",
  "RUF",
  "S",
  "T10",
  "UP",
]
extend-select = [
  "D100",
  "D101",
  "D103",
  "D104",
  "D200",
  "D201",
  "D202",
  "D204",
  "D205",
  "D206",
  "D207",
  "D208",
  "D209",
  "D210",
  "D211",
  "D212",
  "D214",
  "D215",
  "D300",
  "D301",
  "D400",
  "D401",
  "D402",
  "D403",
  "D404",
  "D405",
  "D406",
  "D407",
  "D408",
  "D409",
  "D410",
  "D411",
  "D412",
  "D413",
  "D414",
  "D415",
  "D416",
  "D417",
]
ignore = [
  "E501",
  # Existing exception names are persisted as bounded error classes.
  "N818",
  # All subprocess calls use argv arrays; S602 still rejects shell execution.
  "S603",
  # Maintained developer tools intentionally resolve pinned host tools by PATH.
  "S607",
]

[lint.isort]
known-first-party = ["app", "reasoning_worker", "tests"]

[lint.per-file-ignores]
# Tests intentionally use assertions and fake credentials; production code
# remains subject to the matching security rules.
"tests/**/*.py" = ["D100", "D101", "D103", "D104", "S101", "S105", "S106", "S108"]
# These files use unittest.TestCase intentionally; pytest-style assertion
# rewrites would be broad syntax churn without changing test quality.
"tests/platform/**/*.py" = ["PT009", "S314"]

[lint.pydocstyle]
convention = "google"
